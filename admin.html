rgba(0,0,0,.3)}

<body>
<div id="pbw"><div id="pb"></div></div><div id="pbt"></div>
<header id="hdr" class="hide"><img src="assets/logo.png"><h1>Changwon 2026 · OC Admin</h1><span class="sp"></span><span id="who" style="color:#fff;opacity:.85;font-size:12px"></span> <button class="btn sec" style="padding:6px 10px" onclick="logout()">Logout</button></header>

<script>
/* MASTER ADMIN — 듀얼 모드.
   · MOCK: Supabase 키 미설정 시 localStorage(cw_mock) 공유 데모.
   · LIVE: 관리자 계정(이메일+비밀번호, Supabase Auth + admins 테이블/is_admin RLS) 로그인.
     계정 관련 작업(초대·비밀번호 설정·원클릭 접속·계정 삭제)만 실행 시점에 service_role
     키를 요구(키는 세션 메모리에만 보관, 저장/전송하지 않음). 비상 접속(service key) 병행. */
const SUPABASE_URL = "https://tkdvyxouknhjhaqjrotb.supabase.co";       // <-- Supabase Project URL
const SUPABASE_ANON_KEY = "sb_publishable_vka5Jqtl7JtyzV5BOv9ZcQ_2E5e76Iy";              // <-- anon public key
let sbc=null;try{sbc=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{storageKey:'cw26_admin_auth'}});}catch(e){}
var sbAnon=sbc;
const LIVE = !!(sbc && SUPABASE_URL.indexOf('YOUR-PROJECT')<0 && SUPABASE_ANON_KEY.indexOf('YOUR-ANON')<0);
var SVC_KEY='';var sbAdmin=null; // service_role (런타임 입력, 메모리 전용)
var _S=null;
async function fetchAll(){
  if(!LIVE){_S=mL();return _S;}
  var out={};var ts=['activation_requests','npc_directory','members','invitations','firearms','firearm_submissions','invoices','oc_settings','doc_register','manual_docs','invoice_addresses','ammo_products','ammo_survey','ammo_survey_meta'];
  pbStart(ts.length);
  for(var i=0;i<ts.length;i++){var r=await sbc.from(ts[i]).select('*');out[ts[i]]=r.data||[];pbStep();}
  out.npc_accounts=out.npc_directory;out.invoices=out.invoices||[];out.manual_docs=out.manual_docs||[];
  _S=out;return out;}
function dataS(){var d=LIVE?(_S||{npc_accounts:[],activation_requests:[],members:[],invitations:[],firearms:[],firearm_submissions:[],invoices:[],oc_settings:[],manual_docs:[],invoice_addresses:[]}):mL();d.ammo_products=d.ammo_products||[];d.ammo_survey=d.ammo_survey||[];d.ammo_survey_meta=d.ammo_survey_meta||[];return d;}
/* 관리자 인증 = Supabase Auth 계정(admins 테이블 등록자). service key는 계정 작업·비상 접속 시에만 입력. */
var CUR_ADMIN=null;
var PORTAL_BASE=(location.origin+location.pathname.replace(/[^/]*$/,'')); // 초대·리셋 링크가 되돌아올 포털 주소(하위 경로 포함)

/* ==== top progress bar: real percentage of processed steps ==== */
var _pbT=1,_pbN=0,_pbHide=null;
function pbSet(p){p=Math.max(0,Math.min(100,Math.round(p)));var b=document.getElementById('pb'),t=document.getElementById('pbt');if(b)b.style.width=p+'%';if(t)t.textContent=p+'%';}
function pbStart(total){_pbT=Math.max(1,total||1);_pbN=0;clearTimeout(_pbHide);var w=document.getElementById('pbw'),t=document.getElementById('pbt');if(w)w.style.display='block';if(t)t.style.display='block';pbSet(0);}
function pbStep(n){_pbN+=(n||1);pbSet(_pbN/_pbT*100);if(_pbN>=_pbT)pbEnd();}
function pbEnd(){pbSet(100);clearTimeout(_pbHide);_pbHide=setTimeout(function(){var w=document.getElementById('pbw'),t=document.getElementById('pbt');if(w)w.style.display='none';if(t)t.style.display='none';},400);}

var NPCS_MIN={};
function $(s){return document.querySelector(s)}
function esc(v){return (v==null?'':String(v)).replace(/[&<>"]/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])})}
async function sha(t){var b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t+':cw26'));return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,'0')}).join('')}
function mL(){try{var s=JSON.parse(localStorage.getItem('cw_mock')||'null');if(s){s.activation_requests=s.activation_requests||[];s.outbox=s.outbox||[];s.oc_settings=s.oc_settings||[];return s;}}catch(e){}return {npc_accounts:[],activation_requests:[],outbox:[],members:[],invitations:[],firearms:[],invoices:[],firearm_submissions:[],_seq:1};}
function mS(s){localStorage.setItem('cw_mock',JSON.stringify(s));}
function today(){return new Date().toISOString().slice(0,10)}
function fmtKST(v){if(!v)return '';try{var d=new Date(v);if(isNaN(d.getTime()))return String(v).slice(0,16).replace('T',' ');return d.toLocaleString('sv-SE',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}).replace(/,\s*/,' ');}catch(e){return String(v).slice(0,16).replace('T',' ');}}
/* ===== 모든 관리 테이블 좌측에 순번(#) 열 자동 삽입 ===== */
function numberTables(root){var sc=root||document;var ts=sc.querySelectorAll('.tbl table');
 for(var k=0;k<ts.length;k++){var t=ts[k];if(t.getAttribute('data-numbered'))continue;t.setAttribute('data-numbered','1');
  var hd=t.tHead;
  if(hd){for(var r=0;r<hd.rows.length;r++){var hr=hd.rows[r];var hc=document.createElement('th');hc.innerHTML=(r===0?'#':'');hc.style.cssText='width:38px;min-width:38px;text-align:center';hr.insertBefore(hc,hr.firstChild);}}
  var tb=t.tBodies[0];if(!tb)continue;var n=0;
  for(var i=0;i<tb.rows.length;i++){var row=tb.rows[i];var f=row.cells[0];
   if(f&&f.colSpan>1){f.colSpan=f.colSpan+1;continue;}
   n++;var td=document.createElement('td');td.textContent=n;td.style.cssText='text-align:center;color:#8a94a0;font-size:11.5px;white-space:nowrap';row.insertBefore(td,row.firstChild);}
 }}
function stage(h){$('#app').innerHTML='<div class="wrap">'+h+'</div>';try{numberTables($('#app'))}catch(e){}}
function memName(m){var f=(m.first_name||'').trim(),l=(m.last_name||'').trim();if(f||l)return (l.toUpperCase()+' '+f).trim();return m.name||'';}

function scrLogin(){
  $('#hdr').classList.add('hide');
  $('#app').innerHTML='<div class="center"><div class="box"><div style="display:flex;justify-content:center"><img src="assets/logo.png" style="height:64px;border-radius:50%"></div>'+
  '<h2 style="margin:12px 0 2px;text-align:center;font-size:19px">OC Master Admin</h2>'+
  '<p class="muted" style="text-align:center;margin:0 0 14px;font-size:12px">Changwon 2026 WSPS World Championships — 조직위 전용</p>'+
  (LIVE?'<div style="background:#DDEEE3;border:1px solid #2E8B57;border-radius:10px;padding:8px 10px;margin-bottom:12px;font-size:12px"><b style="color:#1F6B42">LIVE</b> <span class="muted">— 실DB 연결됨. <b>관리자 계정</b>(이메일+비밀번호)으로 로그인하세요. 계정 관련 작업(초대·비밀번호 설정·원클릭 접속·계정 삭제)은 실행 시 service key를 별도로 요청합니다.</span></div>':'<div style="background:#FBE8D8;border:1px solid #E87722;border-radius:10px;padding:8px 10px;margin-bottom:12px;font-size:12px"><b style="color:#B4550E">DEMO</b> <span class="muted">— 로컬 데모 모드. NPC 화면과 같은 브라우저에서 데이터 공유.</span></div>')+
  (LIVE?'<div class="f"><label>이메일</label><input id="aem" type="email" autocomplete="username" placeholder="admin@example.org"></div><div class="f"><label>비밀번호</label><input id="apw" type="password" autocomplete="current-password"></div>':'')+
  '<button class="btn" style="width:100%;background:#7A2E1F" onclick="doLogin()">Enter</button>'+
  (LIVE?'<details style="margin-top:12px"><summary class="muted" style="cursor:pointer;font-size:12px">비상 접속 (service key)</summary><div class="f" style="margin-top:8px"><label>Service key</label><input id="svc" type="password" placeholder="service_role key"></div><button class="btn" style="width:100%;background:#6B7280" onclick="doLoginSvc()">Service key로 접속</button></details>':'')+
  '<div class="err" id="er"></div></div></div>';
  if(LIVE){$('#apw').addEventListener('keydown',function(e){if(e.key==='Enter')doLogin()});$('#svc').addEventListener('keydown',function(e){if(e.key==='Enter')doLoginSvc()});$('#aem').focus();}
}
function adminArm(k){SVC_KEY=k;try{sbAdmin=supabase.createClient(SUPABASE_URL,k,{auth:{autoRefreshToken:false,persistSession:false}});}catch(e){sbAdmin=null;}}
async function needSvc(){if(sbAdmin)return true;
  var k=prompt('계정 관련 작업에는 service_role key가 필요합니다.\n(Supabase → Settings → API Keys → service_role legacy)\n\n키는 이 탭의 메모리에만 보관되며 저장되지 않습니다.','');
  if(k===null)return false;k=k.trim();if(!k){alert('키가 입력되지 않았습니다.');return false;}

function mdFullEditHTML(type,code,date){if(_mdFullHtml==null){var m=manualCollect();m.payload.fullEdit=false;_mdFullHtml=mdBody(m);}return '<div class="doc">'+docHeadA()+'<div id="md_fullbody" contenteditable="true" oninput="_mdFullHtml=this.innerHTML" style="outline:1px dashed #C9A400;background:#FFFDF5;padding:6px;min-height:220px">'+_mdFullHtml+'</div>'+docFootA({sign:true,no:null,date:date})+'</div>';}

/* ===== 직접 편집 툴바: 서식 · 표 편집 · 열 너비 드래그 ===== */
function mdFullSync(){var b=document.getElementById('md_fullbody');if(b){_mdFullHtml=b.innerHTML;if(typeof _DE!=='undefined'&&_DE)_DE.html=b.innerHTML;}}
function mdFocusBody(){var b=document.getElementById('md_fullbody');if(!b)return null;var s=window.getSelection();if(!s.rangeCount||!b.contains(s.anchorNode)){b.focus();}return b;}
function tbBtn(label,fn,title){return '<button type="button" title="'+title+'" onmousedown="event.preventDefault()" onclick="'+fn+'" style="border:1px solid #d8d8d8;background:#fff;border-radius:5px;min-width:30px;height:26px;padding:0 7px;font-size:12px;cursor:pointer;line-height:1">'+label+'</button>';}
function tbSep(){return '<span style="width:1px;height:18px;background:#e0e0e0;margin:0 3px"></span>';}
function mdToolbarHTML(){return '<div id="md_tb" style="position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:4px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 8px;margin-bottom:10px;box-shadow:0 1px 4px rgba(0,0,0,.06)">'+
 tbBtn('A−','mdFont(-1)','글자 작게')+tbBtn('A+','mdFont(1)','글자 크게')+tbSep()+
 tbBtn('<b>B</b>','mdCmd(\'bold\')','굵게')+tbBtn('<i>I</i>','mdCmd(\'italic\')','기울임')+tbBtn('<u>U</u>','mdCmd(\'underline\')','밑줄')+tbSep()+
 tbBtn('◧','mdCmd(\'justifyLeft\')','왼쪽 정렬')+tbBtn('≡','mdCmd(\'justifyCenter\')','가운데 정렬')+tbBtn('◨','mdCmd(\'justifyRight\')','오른쪽 정렬')+tbSep()+
 tbBtn('+행','mdRowIns()','아래에 행 추가')+tbBtn('−행','mdRowDelC()','행 삭제')+tbBtn('+열','mdColIns()','오른쪽에 열 추가')+tbBtn('−열','mdColDelC()','열 삭제')+tbSep()+
 tbBtn('↺','mdCmd(\'undo\')','실행취소')+tbBtn('↻','mdCmd(\'redo\')','다시실행')+
 '<span class="muted" style="font-size:11px;margin-left:auto">표 셀 오른쪽 경계를 드래그하면 열 너비가 조절됩니다</span></div>';}
function mdCmd(c){mdFocusBody();try{document.execCommand('styleWithCSS',false,true);}catch(e){}document.execCommand(c,false,null);mdFullSync();}
function mdFont(d){var b=mdFocusBody();if(!b)return;var s=window.getSelection();
 if(!s||!s.rangeCount||s.isCollapsed){alert('크기를 바꿀 텍스트를 먼저 드래그해 선택하세요.');return;}
 var n=s.anchorNode;n=(n&&n.nodeType===3)?n.parentElement:n;
 var cur=n?parseFloat(window.getComputedStyle(n).fontSize)||13:13;
 var next=Math.max(7,Math.min(48,Math.round(cur)+d));
 try{document.execCommand('styleWithCSS',false,true);}catch(e){}
 document.execCommand('fontSize',false,'7');
 var fs=b.querySelectorAll('font[size="7"]');
 for(var i=0;i<fs.length;i++){var f=fs[i];var sp=document.createElement('span');sp.style.fontSize=next+'px';sp.innerHTML=f.innerHTML;f.parentNode.replaceChild(sp,f);}
 mdFullSync();}
function mdCellCtx(){var s=window.getSelection();var n=s&&s.anchorNode;n=(n&&n.nodeType===3)?n.parentElement:n;
 if(!n||!n.closest)return null;var b=document.getElementById('md_fullbody');if(b&&!b.contains(n))return null;return n.closest('td,th');}
function mdRowIns(){var td=mdCellCtx();if(!td){alert('표 안에 커서를 두고 눌러주세요.');return;}
 var tr=td.parentNode;var nr=tr.cloneNode(true);for(var i=0;i<nr.children.length;i++){nr.children[i].innerHTML='&nbsp;';}
 tr.parentNode.insertBefore(nr,tr.nextSibling);mdFullSync();}
function mdRowDelC(){var td=mdCellCtx();if(!td){alert('표 안에 커서를 두고 눌러주세요.');return;}
 var tr=td.parentNode;if(!confirm('이 행을 삭제할까요?'))return;tr.parentNode.removeChild(tr);mdFullSync();}
function mdColIns(){var td=mdCellCtx();if(!td){alert('표 안에 커서를 두고 눌러주세요.');return;}
 var idx=Array.prototype.indexOf.call(td.parentNode.children,td);var t=td.closest('table');var rows=t.rows;
 for(var r=0;r<rows.length;r++){var c=rows[r].children[idx];var el=document.createElement(c&&c.tagName==='TH'?'th':'td');el.innerHTML='&nbsp;';
  if(c&&c.nextSibling)rows[r].insertBefore(el,c.nextSibling);else rows[r].appendChild(el);}
 mdFullSync();}
function mdColDelC(){var td=mdCellCtx();if(!td){alert('표 안에 커서를 두고 눌러주세요.');return;}
 if(!confirm('이 열을 삭제할까요?'))return;
 var idx=Array.prototype.indexOf.call(td.parentNode.children,td);var t=td.closest('table');var rows=t.rows;
 for(var r=0;r<rows.length;r++){var c=rows[r].children[idx];if(c)rows[r].removeChild(c);}
 mdFullSync();}
var _mdRz=null;
function mdRzMove(e){if(!_mdRz)return;var w=Math.max(24,_mdRz.w+(e.clientX-_mdRz.x));var rows=_mdRz.table.rows;
 for(var r=0;r<rows.length;r++){var c=rows[r].children[_mdRz.idx];if(c)c.style.width=w+'px';}}
function mdRzUp(){if(!_mdRz)return;_mdRz=null;document.body.style.userSelect='';mdFullSync();}
function mdTableResizeInit(){var host=document.getElementById('md_fullbody');if(!host||host._rzOn)return;host._rzOn=1;
 host.addEventListener('mousemove',function(e){if(_mdRz)return;var t=e.target;var td=(t&&t.closest)?t.closest('td,th'):null;
  host.style.cursor=(td&&(td.getBoundingClientRect().right-e.clientX)<6)?'col-resize':'';});
 host.addEventListener('mousedown',function(e){var t=e.target;var td=(t&&t.closest)?t.closest('td,th'):null;if(!td)return;
  var r=td.getBoundingClientRect();if(r.right-e.clientX>6)return;e.preventDefault();
  var table=td.closest('table');if(!table)return;table.style.tableLayout='fixed';if(!table.style.width)table.style.width='100%';
  _mdRz={table:table,idx:Array.prototype.indexOf.call(td.parentNode.children,td),x:e.clientX,w:r.width};
  document.body.style.userSelect='none';});
 document.addEventListener('mousemove',mdRzMove);document.addEventListener('mouseup',mdRzUp);}

function mdEditRender(){var host=document.getElementById('md_doc');if(!host)return;var type=($('#md_type')&&$('#md_type').value)||'custom';var code=(($('#md_ctry')&&$('#md_ctry').value)||'').trim().toUpperCase();var date=($('#md_date')&&$('#md_date').value)||'';

<script>
/* ── 목록 테이블 헤더 클릭 정렬 ──
   thead 의 열 제목을 클릭하면 해당 열 기준 오름차순 ▲ / 내림차순 ▼ 토글 정렬.
   숫자(금액·인원)·날짜(YYYY-MM-DD)는 값으로, 그 외는 문자열로 비교.
   문서 미리보기(.doc)와 편집영역 내부 표는 제외. 화면을 다시 그리면 원래 순서로 복귀. */
(function(){
  function txt(tr,i){var c=tr.cells[i];return c?(c.innerText||'').trim():'';}
  function val(t){
    var s=t.replace(/[,\s]/g,'').replace(/USD|EUR|KRW|%|원/gi,'');
    if(/^-?\d+(\.\d+)?$/.test(s)&&s!=='')return{n:parseFloat(s)};
    if(/^\d{4}[-./]\d{1,2}[-./]\d{1,2}/.test(t)){var d=Date.parse(t.slice(0,10).replace(/[./]/g,'-'));if(!isNaN(d))return{n:d};}
    return{s:t.toLowerCase()};
  }
  document.addEventListener('click',function(e){
    var th=e.target.closest('th');if(!th)return;
    if(th.closest('.doc')||th.closest('[contenteditable="true"]')||th.closest('.print-page'))return;
    if(e.target.closest('input,button,select,a,label'))return;
    var thead=th.closest('thead');if(!thead)return;
    var table=th.closest('table');var tbody=table&&table.tBodies[0];if(!tbody)return;
    var rows=[].slice.call(tbody.rows);if(rows.length<2)return;
    var idx=th.cellIndex;
    var sortable=rows.filter(function(r){return r.cells.length>idx&&!r.querySelector('td[colspan]')});
    if(sortable.length<2)return;
    var dir=th.dataset.sdir==='asc'?'desc':'asc';
    [].forEach.call(thead.querySelectorAll('th'),function(x){delete x.dataset.sdir;var sp=x.querySelector('.sortind');if(sp)sp.remove();});
    th.dataset.sdir=dir;
    var sp=document.createElement('span');sp.className='sortind';sp.textContent=dir==='asc'?' \u25b2':' \u25bc';
    sp.style.cssText='font-size:9px;opacity:.85';th.appendChild(sp);
    var dec=sortable.map(function(r,i){return{r:r,i:i,v:val(txt(r,idx))};});
    dec.sort(function(a,b){var x=a.v,y=b.v,c;
      if(x.n!=null&&y.n!=null)c=x.n-y.n;
      else if(x.n!=null)c=-1;else if(y.n!=null)c=1;
      else c=x.s<y.s?-1:(x.s>y.s?1:0);
      if(c===0)c=a.i-b.i;
      return dir==='asc'?c:-c;});
    var rest=rows.filter(function(r){return sortable.indexOf(r)<0});
    dec.forEach(function(d){tbody.appendChild(d.r)});
    rest.forEach(function(r){tbody.appendChild(r)});
  });
  var st=document.createElement('style');
  st.textContent='.tbl thead th{cursor:pointer;user-select:none} .tbl thead th:hover{background:#dde7f2} .doc thead th{cursor:default}';
  document.head.appendChild(st);
})();
</script>
